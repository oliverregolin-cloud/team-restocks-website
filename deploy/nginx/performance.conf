# ---------------------------------------------------------------------------
# Kompression, Caching und eigene Fehlerseite fuer teamrestocks.de
#
# Einbinden im HTTPS-Server-Block, NACH security-headers.conf:
#   include snippets/performance.conf;
#
# WICHTIG: add_header wird nicht vererbt, sobald ein location-Block ein eigenes
# add_header enthaelt. Deshalb bindet jeder location-Block hier die
# Security-Header erneut ein - sonst verlieren CSS, Bilder und Schriften sie.
# ---------------------------------------------------------------------------

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

# Eigene 404-Seite statt der nginx-Standardmeldung
error_page 404 /404.html;

# Schriften und versionierte Dateien (?v=) aendern sich nie unter gleichem Namen
location ~* \.(?:woff2|css|js)$ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Bilder: 30 Tage. Bewusst kein "immutable" - die Dateinamen tragen keine
# Version, ein ausgetauschtes Logo soll nicht ein Jahr lang haengen bleiben.
location ~* \.(?:png|webp|jpe?g|svg|ico)$ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}

# HTML immer gegen den Server pruefen, damit Aenderungen sofort ankommen
location ~* \.html$ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location = / {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

# Suchmaschinen-Dateien: kurz zwischenspeichern, damit Korrekturen schnell greifen
location = /robots.txt {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    access_log off;
}

location = /sitemap.xml {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
}
