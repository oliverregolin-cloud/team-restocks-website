# ---------------------------------------------------------------------------
# Security-Header fuer teamrestocks.de
#
# Behebt alle Punkte aus dem securityheaders.com-Report vom 19.08.2026
# (Bewertung vorher: F - saemtliche Security-Header fehlten).
#
# Einbinden im HTTPS-Server-Block:  include snippets/security-headers.conf;
# Ausfuehrliche Anleitung:          deploy/README.md
#
# WICHTIG (nginx-Eigenheiten):
#   * "always" sorgt dafuer, dass die Header auch bei Fehlerseiten
#     (404, 500, ...) mitgeschickt werden.
#   * add_header wird NICHT mehr vom uebergeordneten Block geerbt, sobald ein
#     location-Block ein eigenes add_header enthaelt. In solchen locations
#     dieses Snippet erneut per include einbinden.
# ---------------------------------------------------------------------------

# Versteckt die nginx-Versionsnummer im Server-Header ("nginx" statt
# "nginx/1.24.0 (Ubuntu)") -> Punkt "Additional Information" im Report.
server_tokens off;

# Strict-Transport-Security
# Erzwingt HTTPS fuer ein Jahr, inkl. www.teamrestocks.de (CNAME auf die Apex).
# "preload" bewusst NICHT gesetzt: das waere eine Anmeldung bei
# hstspreload.org und nur sehr traege wieder rueckgaengig zu machen.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy
# Die Seite ist vollstaendig self-hosted: Fonts, CSS, JS und Bilder liegen
# alle auf der eigenen Domain, es gibt keine Inline-Skripte, keine
# style="..."-Attribute und keine externen Einbindungen (kein Google Fonts,
# kein Analytics). Deshalb ist eine strikte Policy ohne 'unsafe-inline'
# moeglich. Externe Links (Discord, Instagram, TikTok) sind reine
# Navigationen und von der CSP nicht betroffen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

# X-Frame-Options
# Clickjacking-Schutz fuer aeltere Browser; moderne Browser nutzen
# frame-ancestors aus der CSP oben.
add_header X-Frame-Options "SAMEORIGIN" always;

# X-Content-Type-Options
# Verbietet MIME-Sniffing, der Browser haelt sich an den Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Referrer-Policy
# Beim Klick auf externe Links (Discord/Instagram/TikTok) wird nur die
# Herkunfts-Domain uebertragen, nie der volle Pfad.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy
# Alle Browser-Features abschalten, die die Seite nicht benutzt.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

# ---------------------------------------------------------------------------
# "Upcoming Headers" aus dem Report
# ---------------------------------------------------------------------------

# Trennt den Browsing-Context von fremden Seiten (Tabnabbing-Schutz).
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Fremde Seiten duerfen Ressourcen dieser Domain nicht als Subresource
# einbinden (Hotlinking/Side-Channel-Schutz). Betrifft nur Browser -
# Link-Vorschauen von Discord/WhatsApp & Co. holen das og:image serverseitig
# und sind davon nicht betroffen.
add_header Cross-Origin-Resource-Policy "same-origin" always;

# "credentialless" statt "require-corp": erfuellt denselben Zweck, wuergt aber
# spaeter eingebundene Fremdinhalte (z. B. ein YouTube-Embed) nicht komplett
# ab, sondern laedt sie nur ohne Cookies.
add_header Cross-Origin-Embedder-Policy "credentialless" always;
